<svg viewBox="0 0 1810 865" role="img" aria-label="The CADR mapped onto one XC7Z007S, the small Zynq on a Cora Z7-07S. This drawing is the Arty Z7-20's: every block is in the same place, and what this board does not have is crossed off where it stands rather than taken out, with a red cross and a faint label, so that the two boards can be read against each other. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface — the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 100 MHz, 29 ticks to the microcycle, 290 nanoseconds of real time for the 145 the drawings name. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller and the TV, and to the Unibus, carrying the I/O board. Four AXI ports cross into the processing system: S_AXI_HP0, which the memory bridge masters; S_AXI_HP2, which the disk controller masters to fetch a block out of DDR itself; M_AXI_GP0, over which the PS reaches the disk controller, the Chaosnet buffers, the serial port and the keyboard and mouse registers, one 4 KB page each behind a decode that answers every address on the port; and M_AXI_GP1, carrying the console --- the sixteen diagnostic registers, in muir's own spy vocabulary --- and the debug cable's register block beside it. Seven things are crossed off as not available on this board: the display output block, the fifth port that fed it, the HDMI out connector, the USB input program, the USB host controller, the port it would drive and the no-auto-boot switch, this board having no HDMI connector, no USB host port and no switches. The lines that reached them stay drawn, as every line on this drawing does, carrying no status of their own. So the machine's screen, keyboard and mouse are the RFB server over the network and nothing else, and the hold that keeps the machine from booting by itself is the card's own flag file alone. Beside the bus interface, a debug cable adapter puts the cable's 21 wires --- 20 signals out and 19 back, the data bus going both ways --- onto one Pmod connector of 8 pins --- four each way, a strobe and three data lines in each direction --- and presents the same registers on M_AXI_GP1. The cable's own supply pins are left open at both ends, so that joining two boards over it cannot join their 3.3 volt rails, and the connector on the drawing says so in red. It is the same fabric the larger board carries, where MIT's own CC has halted the machine over the cable and read back its registers, its main memory and its scratchpads. Nothing has driven it on this board, so it is drawn as checked rather than shown. Two status lights at the board's right, drawn in the colour each shows when it is lit. LD0 is MACHRUN, the machine's own run signal as a level, dim in proportion to the time it waits for memory. LD1 is one lamp with three meanings, each on a row of its own in the colour it shows, in priority order: red when the machine has halted itself on an error, blue while it fetches its microinstructions out of the boot PROM, and otherwise green, blinking with the retiring microcycles. Blue then green is a boot, green gone still is a machine somebody halted, and red is a machine that fell over. The last two rows of the block are crossed off in the same way, because two lamps cannot carry what six carry on the larger board: there is no lamp here for the fabric's own clock and none for the disk's activity. Above them, BTN0 is the machine's boot button, the light panel's own -BOOT2, debounced in fabric and pressed by the console's boot command through a register as well, and it restarts the machine; BTN1 below it in the same block resets the whole fabric, which is the same pair of buttons on every board here. On the Linux side, from the left: the RFB server, which serves the machine's screen to a viewer and carries the viewer's keys and mouse to the card's own shift register and quadrature counters; Chaosnet routing over the board's Ethernet, which carries the machine's packets to the network and answers nothing itself; the CADR's serial line offered on a TCP socket as muir offers it; the disk packs as files on the microSD card, one file a drive and up to eight of them, served to the controller by a program on the board; the console; and, at the room's right, muir, which runs on the Arm cores and carries MIT's own CC as the debugger. Below the ports is the processing system: an outline for Linux on the Arm cores, which boots from the card beside the running CADR with the CADR's 128 MB kept from it and holds the programs that run under it, each coloured for itself; beside it the boot loader in two parts, U-Boot itself, which is upstream and drawn grey as an existing component, and inside it its first stage, the SPL, drawn green because the board boots from it and because the start-up routine that first stage runs is generated here. At the foot of the processing system is a row of controllers, each of them over the connector it drives and all of them grey, because on this board every one is the part's own silicon: the DDR controller, the gigabit MAC, the SD host and the UART, with the USB host crossed off at the end of the row, this board having no port for it. The DDR controller has four ports arbitrated in hardware, fed by the machine's two fabric ports from above and by the Arm cores from the Linux group over it, with one line out of the chip to the DRAM. Every line that leaves a program ends on one of these and never on a connector, and each controller has one line down to its own. The UART is the one Linux's console comes out of, and under it is the board's USB-UART and JTAG socket --- one micro-USB socket carrying that console and JTAG together through one bridge, and the one a boot log comes out of. The microSD card holds everything the board needs: U-Boot with its first stage, the CADR's bitstream, Linux with its root filesystem, and the disk packs as files, one a drive. The two sequence drawings below say how the board boots, on its own from the card and, for development, from a TFTP server. The 512 MB of DDR3 sits outside the chip, holding main memory and the display's frame buffer; the RFB server reaches it through the processor's own port on the controller, like any other software. How far along each block is, which the drawing otherwise says in colour --- green only for what this board itself has shown, turquoise for what is checked here and has not run on it, and the red cross for what this board does not have at all. The machine is green: it has booted MIT's Lisp Machine system on this board out of real memory off a real disk and run past twelve billion microcycles with no error, which takes in the clock generator, the two processor boards, the bus interface, the Xbus-to-DDR bridge and the port behind it, the disk controller and its own port, the TV and the I/O board. The disk controller is green because the machine read its band off the pack on this board and wrote blocks back to it. The TV is green because the screen is painted: the window system, a Lisp Listener and the who-line, read off over the network. The I/O board is green because the who-line's clock advances off the machine's own microsecond clock and the mouse the machine tracks is the card's registers being read. The console is green, having answered on this board and reported the machine running. The RFB server is green, having served this board's screen; a viewer's keys and pointer have not been tried here, and on this board they are the only way in. Chaosnet is green: the machine took its date from the file and time host on the network, which is the only way a machine with no clock of its own can have one. The disk packs program is green, and so are the first stage and Linux, the board having booted from its own card. Two blocks are turquoise: the serial line, whose program runs and listens here though nothing shows a character has crossed the machine's serial line on this board, and the debug cable adapter, which no debugger has driven here. Under the fabric's label, two figures for this board, place and routed with the processing system and DDR3 behind the machine's memory port: 3,999 of the 4,400 slices occupied, 90.9 per cent; and 187 KB of the 225 KB of block RAM, 83.0 per cent. The machine spends the same 41.5 block RAM tiles here as it does on the larger part, so what changes between the two boards is the denominator. The timing of this build is met: the fabric runs at 100 megahertz with a tick of 10 nanoseconds, worst slack plus 0.494 nanoseconds against that, and none of its 47,909 endpoints failing. ">
