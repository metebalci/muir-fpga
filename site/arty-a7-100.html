<svg viewBox="0 0 1810 865" role="img" aria-label="The CADR mapped onto one XC7A100T, the Artix-7 on an Arty A7-100. This drawing is the Arty Z7-20's: every block is in the same place, what this board does not have is crossed off where it stands with a red cross and a faint label, and what has to take the place of a processing system is drawn in the positions that system's own parts held. THIS BOARD HAS NO PROCESSING SYSTEM AT ALL: no Arm cores, no Linux, and nothing but fabric and the memory beside it. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface --- the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 100 MHz, 29 ticks to the microcycle, 290 nanoseconds of real time for the 145 the drawings name. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller and the TV, and to the Unibus, carrying the I/O board. What the board has shown of the machine is green and the rest is turquoise, which on this board means built and checked here and not yet run on it: the clock generator and the two processor boards are green, the first 1,024 microcycles of a run on this board having been read back over JTAG and agreed with muir column for column; and the bus interface is green, because a board with nothing behind its memory port exercises its arbitration, its address decode and its non-existent-memory timer hardest of all --- 514 cycles a run end on that timer and the machine goes on. The Xbus-to-DDR bridge, the disk controller, the TV, the I/O board and the debug cable adapter are turquoise: nothing on this board has driven them yet. Four things are crossed off as not available on this board: the display output block, the fifth port that fed it, the HDMI out connector and the USB input program, this board having no HDMI connector and no USB host controller at all. The board's USB socket is not crossed off, because it is the same socket doing a different thing here: it is the FTDI bridge's UART on two of the fabric's own pins, and the position the USB input program held carries the UART that drives it, taking out the firmware's own console, as Linux's console comes out of the same socket on a Zynq board. Of the five ports the processing system gave the larger board, S_AXI_HP3 is the one nothing replaces and it is crossed off with the display it fed; the other four positions carry what the soft processing system needs instead --- a MAC for the board's own Ethernet PHY where S_AXI_HP0 was, an SD host in SPI mode on Pmod JD where S_AXI_HP2 was, the machine's register faces where M_AXI_GP0 was, and the debug window where M_AXI_GP1 was. The faces themselves do not change: the disk controller's, the I/O board's, the input card's and the debug cable's are the same registers at the same addresses, and what changes is who masters them. Below them, in the room the Linux programs held, is the soft processing system: a small soft processor, an Ibex, in the place muir holds on a board with Arm cores to run it on, and the firmware's own services in the places the programs held --- an RFB server for the screen, the keys and the mouse, which on this board is the only way in; Chaosnet; the CADR's serial line; the disk packs as files on a card; the console; and, in the last place, the UART. All of them are drawn as not started, because they are. The Ibex and the memory controller are drawn as under development, being built now; the MAC, the SD host, the UART and the boot are not started. Beside the room, where U-Boot and its first stage sit on the other boards, is the boot: this part has no boot ROM and no card controller, so it configures itself out of its own 16 MB QSPI flash at power-on, and that flash carries the bitstream and the firmware beside it, with a first-stage loader in block RAM copying the firmware into memory and starting it. Main memory is a controller in the fabric rather than a processing system's own, because the 256 MB of DDR3L on this board is on the fabric's own pins; the machine's memory port reaches it on one side and the soft processor on the other. Beside the bus interface, a debug cable adapter puts the cable's 21 wires as sixteen --- 20 signals out and 17 in, the data bus going both ways --- onto one Pmod connector of 8 pins and carries the whole link in both directions. It is the same fabric the Zynq boards carry, where MIT's own debugger has halted the machine and read it back; nothing has driven it here, and the debugger at the other end of JA would be one of the other boards. Six status lights at the board's right, drawn in the colour each shows when it is lit and numbered as this board numbers them, which is the other way round from the Zynq boards: its four tricolour lamps are LD0 to LD3 and its four green ones LD4 to LD7, and the two tricolour lamps left over are dark. LD4 is MACHRUN, the machine's own run signal as a level, dim when it is waiting for memory; LD5 the fabric's clock and LD6 retiring microcycles, both blinking; LD7 the disk moving a block; LD0 dark until the machine halts itself on an error and then red; LD1 PROMENABLE, the boot PROM's own select, blue while the machine fetches its microinstructions out of the boot PROM and dark once it runs microcode it loaded from a disk. Above them, BTN0 is the machine's boot button, the light panel's own -BOOT2, and BTN1 below it in the same block resets the whole fabric, which is the same pair of buttons on every board here; above BTN0, SW0 is the no-auto-boot switch, which this board has. At the board's edge: the 256 MB of DDR3L, the board's own Ethernet PHY on fabric pins, which is what lets a MAC in fabric reach a wire at all, a microSD card on a Pmod in JD, this board having no card slot of its own, and the USB-UART. Under the fabric's label, figures for the machine alone, place and routed with nothing behind its memory port: 6,009 of the 63,400 lookup tables, 9.5 per cent; 2,403 of the 126,800 registers, 1.9 per cent; and 171 KB of the 608 KB of block RAM, 28.2 per cent. Everything the soft processing system owes is still to be built, so these figures will grow. The timing of this build is met: the fabric runs at 100 megahertz with a tick of 10 nanoseconds, worst slack plus 1.227 nanoseconds against that, and none of its 27,148 endpoints failing. There are no boot sequence drawings on this page, because nothing has yet booted this board from its own flash. ">

               into memory and starts it.  Both are ours, so neither is grey; and
               neither is started, so neither is filled. -->
          <rect class="d-plate" x="1226" y="542" width="54" height="128"/>
          <rect class="d-dot" x="1226" y="542" width="54" height="128"/>

          <rect class="d-plate" x="240" y="562" width="130" height="96"/>
          <rect class="d-box" x="240" y="562" width="130" height="96"/>
          <text class="d-t" x="305" y="586" text-anchor="middle">terminal</text>
          <text class="d-s" x="305" y="606" text-anchor="middle">an RFB server: the screen,</text>
          <text class="d-s" x="305" y="620" text-anchor="middle">the keys and the mouse</text>
          <text class="d-s" x="305" y="642" text-anchor="middle">&mdash; the only way in here</text>

          <text class="d-s" x="452" y="606" text-anchor="middle">routing, and the</text>
          <text class="d-s" x="452" y="620" text-anchor="middle">cable to the net</text>

          <text class="d-t" x="599" y="586" text-anchor="middle">serial</text>

          <text class="d-s" x="599" y="642" text-anchor="middle">as muir offers it</text>

          <text class="d-t" x="746" y="586" text-anchor="middle">disk packs</text>
          <text class="d-s" x="746" y="606" text-anchor="middle">a drive&rsquo;s blocks as a file,</text>
          <text class="d-s" x="746" y="620" text-anchor="middle">one file a drive</text>

          <!-- Where the larger boards read a keyboard and a mouse off a USB

               socket is instead is a serial bridge on two fabric pins, so the
               position carries the UART that drives it.  It takes two things
               out: the firmware's own console, which is how a person sees this
               board come up before anything on the network answers, and the
               CADR's own serial line, which on the boards with Linux is a TCP
               socket and here can be either.  A keyboard and a mouse reach this
               machine from a viewer over the network, through the RFB server,
               which is the one thing that writes those registers on any of
               these boards. -->
          <rect class="d-plate" x="975" y="562" width="130" height="96"/>
          <rect class="d-box" x="975" y="562" width="130" height="96"/>
          <text class="d-t" x="1040" y="586" text-anchor="middle">UART</text>
          <text class="d-s" x="1040" y="606" text-anchor="middle">the firmware&rsquo;s own console,</text>
          <text class="d-s" x="1040" y="620" text-anchor="middle">as Linux&rsquo;s is on a Zynq board,</text>
          <text class="d-s" x="1040" y="642" text-anchor="middle">out of the board&rsquo;s USB socket</text>

          <rect class="d-plate" x="1122" y="562" width="80" height="96"/>
          <rect class="d-box d-wip" x="1122" y="562" width="80" height="96"/>
          <text class="d-t" x="1162" y="586" text-anchor="middle">Ibex</text>
          <text class="d-s" x="1162" y="606" text-anchor="middle">a soft CPU,</text>
          <text class="d-s" x="1162" y="620" text-anchor="middle">RV32IMC,</text>
          <text class="d-s" x="1162" y="642" text-anchor="middle">bare metal</text>

          <!-- main memory.  On the boards with a processing system this is its
               own controller, which is Xilinx silicon.  Here the DRAM is on the
               fabric's own pins, so the controller has to be in the fabric too,
               and it is being built now.  The machine's memory port reaches it
               on one side and the soft processor on the other, which is the same
               shape the Zynq's controller has with fewer ports. -->
          <rect class="d-plate" x="-22" y="580" width="218" height="60"/>
          <rect class="d-box d-wip" x="-22" y="580" width="218" height="60"/>
          <text class="d-t" x="87" y="604" text-anchor="middle">DDR3 controller</text>
          <text class="d-s" x="87" y="624" text-anchor="middle">in the fabric, generated</text>
          <!-- the soft processor reaches memory through the controller like
               everything else; the line from the outline is that port -->
          <path class="d-line" d="M196,610 L220,610"/>
          <path class="d-line" d="M87,640 L87,712"/>
          <path class="d-line" d="M305,658 L305,712 M452,658 L452,712 M599,658 L599,712 M746,658 L746,712"/>

          <rect class="d-box d-ext" x="-79" y="712" width="332" height="84"/>
          <text class="d-t" x="87" y="738" text-anchor="middle">256 MB DDR3L</text>
          <text class="d-s" x="87" y="762" text-anchor="middle">on the fabric&rsquo;s own pins, not a processing</text>
          <text class="d-s" x="87" y="776" text-anchor="middle">system&rsquo;s &mdash; 64 MB reserved for main memory,</text>
          <text class="d-s" x="87" y="790" text-anchor="middle">8 MB for the display, the rest the firmware&rsquo;s</text>
          <!-- ONE CONNECTOR CARRIES THE WHOLE DEBUG LINK, IN BOTH
               DIRECTIONS.  A board is a debugger or a debuggee by
               configuration and never both at once, so a second connector
               bought only a chain of three machines and nothing wanted one.
               The eight pins are one clock from the debugger's end and seven
               data split into lanes.  No beat count is on the drawing,
               because nothing is built to that shape yet. -->
          <rect class="d-box d-ext" x="1305" y="88" width="150" height="76"/>
          <text class="d-t" x="1380" y="110" text-anchor="middle">Pmod JA</text>
          <text class="d-t" x="1380" y="128" text-anchor="middle">DEBUG CABLE</text>
          <text class="d-s" x="1380" y="150" text-anchor="middle">1 clock + 7 data</text>
          <!-- The machine's boot button, above the lamps because on MIT's
               light panel it sits with them.  There it is -BOOT2, a momentary
               contact pulled up and taken low through a Schmitt inverter,
               meeting the keyboard's -BOOT1 and the debug cable's PROG.BOOT at
               the gate that makes -BOOT, which presets RUN and forces the boot
               trap.  Here it is BTN0, debounced in fabric, and the console's
               boot command presses the same line through a register.
               Written as the lamps are written: one row at their own left
               margin, the glyph on their centre line and the text 14 to the
               right of it, so the block is one row where the lamp block is
               six.  The glyph is a square and not a dot, and carries no lit
               colour, because a momentary button is not a light; its 8 by 8
               is the area of a lamp's 4.5 radius.  Its line reaches the
               fabric as the lamps' does, from that rectangle's right edge to
               this block's left edge at the block's own centre. -->
          <rect class="d-box d-ext" x="1305" y="264" width="150" height="66"/>
          <rect x="1315" y="275" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="283">BTN0 &mdash; BOOT</text>
          <rect x="1315" y="307" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="315">BTN1 &mdash; RESET</text>
          <path class="d-line" d="M1290,297 L1305,297"/>
          <!-- The six lamps, assigned for a user rather than for bring-up,
               and the light panel's own two are the ones that moved: the CADR
               carried a run lamp and a parity-error lamp beside its boot
               button, and BTN0 is that button now.  THIS BOARD NUMBERS ITS
               LAMPS THE OTHER WAY ROUND: its four tricolour lamps are LD0 to
               LD3 and its four green ones LD4 to LD7, so the same six meanings
               land on different silkscreen numbers and the two tricolour lamps
               left over, LD2 and LD3, are dark.  The numbers below are this
               board's own.  LD4 is the run lamp as a
               level, dim in proportion to the time the machine waits for
               memory; LD0 is ERRHALT, the machine halting itself under
               ERRSTOP, and is dark unless that has happened --- a timeout, a
               disk miss and a statistics halt used to reach it too and no
               longer do, a lamp whose normal state is red saying nothing;
               LD1 is PROMENABLE, MIT's net at PCTL 1C19 driven from the net
               itself, lit while the machine fetches its microinstructions out
               of the boot PROM and dark once it runs the microcode it loaded
               from the disk.  Each lamp is named for the machine's own
               signal.  It is the PROM's own SELECT and not the mode register's
               PROMDISABLE bit, which is why it goes out on every
               control-store write while the PROM loads the store and the lamp
               sits a little under full brightness.  docs/board.md carries the
               same table in prose. -->

          <text class="d-s" x="1333" y="382">LD5 &mdash; fabric clock</text>
          <circle cx="1319" cy="400" r="8" fill="none" stroke="#2da44e" stroke-width="1" stroke-opacity="0.5"/>
          <circle class="d-lamp-fast" cx="1319" cy="400" r="4.5" fill="#2da44e" fill-opacity="1" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="404">LD6 &mdash; microcycles</text>
          <circle class="d-lamp-disk" cx="1319" cy="422" r="4.5" fill="#2da44e" fill-opacity="1" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="426">LD7 &mdash; disk activity</text>
          <circle cx="1319" cy="444" r="4.5" fill="#d1495b" fill-opacity="1" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="448">LD0 &mdash; ERRHALT</text>
          <circle cx="1319" cy="466" r="4.5" fill="#0969da" fill-opacity="1" stroke="currentColor" stroke-width="1"/>
          <text class="d-s" x="1333" y="470">LD1 &mdash; PROMENABLE</text>
          <path class="d-line" d="M1290,412 L1305,412"/>
          <!-- The no-auto-boot switch, above the boot button because that is
               the order they are used in: the switch decides how the machine
               comes up and the button decides when it goes.  With it on the
               machine comes out of reset with RUN clear, as a CADR is when the
               power comes on with nobody at it, and only -BOOT starts it; the
               card's fpgarc has a flag that asks for the same thing and the two
               are an OR.  It is read at the fabric's reset and nowhere else, so
               moving it under a running machine does nothing until the next one.
               Written as BTN0 below is written: one row at the lamps' own left
               margin, the glyph on their centre line and the text 14 to the
               right of it.  The glyph is a slide switch --- a body 10 wide with
               its lever at the left, which is off --- and carries no lit colour,
               a switch not being a light; it is centred on 1319 like every lamp
               and like BTN0's square.  Its line reaches the fabric as theirs
               do. -->
          <rect class="d-box d-ext" x="1305" y="228" width="150" height="30"/>
          <rect x="1314" y="239" width="10" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1"/>
          <rect x="1315" y="240" width="4" height="6" fill="currentColor" fill-opacity="0.45" stroke="none"/>
          <text class="d-s" x="1333" y="247">SW0 &mdash; NO AUTO BOOT</text>
          <path class="d-line" d="M1290,243 L1305,243"/>

               system is a host a keyboard plugs into and here is the FTDI
               bridge's UART on two fabric pins.  It is the same socket in the
               same place doing a different thing, so it is not crossed off: it
               is labelled for what it is here, and the UART above it is what

          <rect class="d-box d-ext" x="970" y="712" width="140" height="84"/>
          <text class="d-t" x="1040" y="738" text-anchor="middle">USB-UART</text>
          <text class="d-s" x="1040" y="760" text-anchor="middle">the FTDI bridge,</text>
          <text class="d-s" x="1040" y="774" text-anchor="middle">on two of the fabric&rsquo;s pins</text>
          <path class="d-line" d="M1040,658 L1040,712"/>


          <!-- The connectors on the board itself.  The Ethernet is the
               fabric's own here rather than a processing system's, which is what

          <rect class="d-box d-ext" x="268" y="712" width="370" height="84"/>
          <text class="d-t" x="453" y="738" text-anchor="middle">Ethernet PHY</text>
