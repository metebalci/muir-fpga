<svg viewBox="0 0 1810 865" role="img" aria-label="The CADR mapped onto one XC7A100T, the Artix-7 on an Arty A7-100. THIS BOARD HAS NO PROCESSING SYSTEM AT ALL: no Arm cores, no Linux, and nothing but fabric and the memory beside it. The drawing shows what is on this board and nothing else, and what the board has not got is not drawn at all. Every block it does have stands where the Arty Z7-20's drawing puts the same block, so the two pages can be read side by side. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface --- the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 100 MHz, 29 ticks to the microcycle, 290 nanoseconds of real time for the 145 the drawings name. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller, the TV and the LISPM TV, and to the Unibus, carrying the I/O board. The LISPM TV is MIT's colour display and is not started: it is the same board strapped to a second Xbus address, 576 by 454 pixels of four bits each through a write-only colour map of sixteen entries, and it stands as a second screen beside the monochrome one rather than in its place. What the board has shown of the machine is green and the rest is turquoise, which on this board means built and checked here and not yet run on it: the clock generator and the two processor boards are green, the first 1,024 microcycles of a run on this board having been read back over JTAG and agreed with muir column for column; and the bus interface is green, because a board with nothing behind its memory port exercises its arbitration, its address decode and its non-existent-memory timer hardest of all --- 514 cycles a run end on that timer and the machine goes on. The Xbus-to-DDR bridge is green too: the machine has run MIT's boot PROM out of real DDR3L through it on this board, 256 reads and 256 writes asked and answered at the controller's own interface. The disk controller, the TV, the I/O board and the debug cable adapter are turquoise: nothing on this board has driven them yet. The one micro-USB socket this board has, the FTDI bridge, carries a console and JTAG together, and it is drawn under the UART that drives it, in the row of connectors along the board's edge. Under the machine is a band with one box in it and two wires passing through it, and the rest of the band is empty because there is nothing there. The machine's memory path runs as one line from the Xbus-to-DDR bridge straight down into the memory controller, and the machine has run MIT's boot PROM out of real DDR3L along it on this board. The disk controller's channel, which would fetch the pack's blocks out of memory, runs as one line down into the same controller beside it, and nothing has moved along that one yet: the pack face answers its own registers and its memory master is not joined to the controller. Naming either wire in a box would be inventing a part this board has not got, so nothing is drawn where they pass. The one box is a component rather than a wire, which is why it is drawn: the soft system's AXI bridge, which turns one load or store by the soft processor into one transaction at one of the machine's register faces and answers every address it does not implement, so that a load cannot hang the processor. It is green, the firmware having read every face it has through it. The faces behind it are the disk controller's, the I/O board's, the input card's and the console's, the two that are built here being the disk controller's and the console's, and this one bridge reaches all of them. The I/O board's and the input card's wait on the services that would drive them, which are the RFB server, Chaosnet and the serial line, and all three are not started. There is no register window here for a program to debug the machine through, the only processor on this board being the soft one below and that one being the console. The firmware is the console, and it is what has halted this machine, stepped it by one microcycle and started it again. The debugger for this board is another board over Pmod JB, which is one of the two high-speed Pmods on this board where JA is a standard one with series resistors, and the card sits on the other standard one, JD. Below them is the soft processing system. At its left, where the two Zynq boards put their Arm cores, is the small soft processor this board has instead: an Ibex, RV32IMC at 50 megahertz, and it is green, its firmware having run on this board. Beside it is the boot, the processor and the thing that starts it standing together. No line leaves the Ibex for the memory controller, where the Arm cores on the other boards have one: this processor's program is 32 kilobytes of block RAM and its address map names no memory at all, so the only things that reach the DDR3L are the machine's own port and the debugger's window in front of it. Beside those two is the room the firmware's services stand in --- an RFB server for the screen, the keys and the mouse, which on this board is the only way in; Chaosnet; the CADR's serial line; the disk packs as files on a card; and the console --- and the rail they hang from runs left out of that room to a drop into the Ibex, which masters the bridge the rail hangs from. That left end crosses the machine's memory path and the disk controller's channel and joins neither: those two run the whole height of the space between, so there is no way across it that does not cross them. The right end of the room is empty, where the boot used to stand. The console is green: it is what has halted the machine on this board, stepped it by one microcycle with SSDONE up and started it again, read at the wire. The disk packs are partly built, the firmware having read the pack face's own registers with no card behind them and no block moved. The RFB server, Chaosnet and the serial line are not started. At the foot of that room is a row of controllers, each of them the same width as the connector it drives and squared over it: the memory controller, the MAC, the SD host and the UART. Every line that leaves a service ends on one of these and never on a connector, and each controller has one line down to its own. Not one of that row is a hard block: every one of them is in this board's fabric. The Ibex is green, its firmware having run on this board, read every register face it has and worked the machine through the console's; the memory controller and the UART are green with it; and the MAC, the SD host and the boot are not started. The boot beside the Ibex is in the two parts a boot loader has on the other boards: this part has no boot ROM and no card controller, so it configures itself out of its own 16 MB QSPI flash at power-on, and that flash carries the bitstream and the firmware beside it, with a first-stage loader in block RAM copying the firmware into memory and starting it. Main memory is a controller in the fabric rather than a processing system's own, because the 256 MB of DDR3L on this board is on the fabric's own pins; the machine's memory port reaches it and the soft processor does not, its firmware running out of block RAM, so nothing comes down into that controller from the room above where both Zynq boards have the Arm cores' own port. In the row with that controller, in the one position every board's drawing gives it, is the UART: here it is ours and it is green, the firmware's own console having been read at the wire at 115,200 baud, and it reaches the micro-USB socket drawn under it. Beside the bus interface, a debug cable adapter puts the cable's 21 wires --- 20 signals out and 19 back, the data bus going both ways --- onto one Pmod connector of 8 pins and carries the whole link in both directions. On this board that connector is JB, which is one of its two high-speed Pmod headers. The cable's own supply pins are left open at both ends, so that joining two boards over it cannot join their 3.3 volt rails, and the connector on the drawing says so in red. It is checked here and nothing on this board has driven it, and the debugger at the other end of JB would be another board. Six status lights at the board's right, drawn in the colour each shows when it is lit and numbered as this board numbers them: its four tricolour lamps are LD0 to LD3 and its four green ones LD4 to LD7, and the two tricolour lamps left over are dark. LD4 is MACHRUN, the machine's own run signal as a level, dim when it is waiting for memory; LD5 the fabric's clock and LD6 retiring microcycles, both blinking; LD7 the disk moving a block; LD0 dark until the machine halts itself on an error and then red; LD1 PROMENABLE, the boot PROM's own select, blue while the machine fetches its microinstructions out of the boot PROM and dark once it runs microcode it loaded from a disk. Above them, BTN0 is the machine's boot button, the light panel's own -BOOT2, and BTN1 below it in the same block resets the whole fabric, which is the same pair of buttons on every board here; above BTN0, SW0 is the no-auto-boot switch, which this board has. At the board's edge, one under each controller of the row: the 256 MB of DDR3L, the board's own Ethernet PHY on fabric pins, which is what lets a MAC in fabric reach a wire at all, a microSD card on a Pmod in JD, this board having no card slot of its own, and the one micro-USB socket that carries the console and JTAG. Under the fabric's label, two figures for the whole board, place and routed with the memory controller behind the machine and the soft processing system in front of its register faces: 6,184 of the 15,850 slices occupied, 39.0 per cent; and 218 KB of the 608 KB of block RAM, 35.9 per cent. The timing of this build is met: the fabric runs at 100 megahertz with a tick of 10 nanoseconds, worst slack plus 0.148 nanoseconds against that, and none of its 60,287 endpoints failing. How this board would come up out of its own flash is on the Booting page, and that sequence is a plan rather than a board: today the fabric is configured over JTAG and the firmware runs with no card. ">

          <!-- THIS ROW HOLDS ONE BOX AND TWO WIRES, and the rest of it is empty

               that line would claim a master this board has not got. -->

          <rect class="d-box d-done" x="836" y="652" width="122" height="40"/>
          <text class="d-t" x="897" y="670" text-anchor="middle">UART</text>
          <text class="d-s" x="897" y="684" text-anchor="middle">the firmware&rsquo;s console</text>

          <!-- ONE CONNECTOR CARRIES THE WHOLE DEBUG LINK, IN BOTH
