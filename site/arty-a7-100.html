<section>

<svg viewBox="0 0 1810 865" role="img" aria-label="The CADR mapped onto one XC7A100T, the Artix-7 on an Arty A7-100. This drawing is the Arty Z7-20's: every block is in the same place, what this board does not have is crossed off where it stands with a red cross and a faint label, and what has to take the place of a processing system is drawn in the positions that system's own parts held. THIS BOARD HAS NO PROCESSING SYSTEM AT ALL: no Arm cores, no Linux, and nothing but fabric and the memory beside it. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface --- the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 100 MHz, 29 ticks to the microcycle, 290 nanoseconds of real time for the 145 the drawings name. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller and the TV, and to the Unibus, carrying the I/O board. What the board has shown of the machine is green and the rest is turquoise, which on this board means built and checked here and not yet run on it: the clock generator and the two processor boards are green, the first 1,024 microcycles of a run on this board having been read back over JTAG and agreed with muir column for column; and the bus interface is green, because a board with nothing behind its memory port exercises its arbitration, its address decode and its non-existent-memory timer hardest of all --- 514 cycles a run end on that timer and the machine goes on. The Xbus-to-DDR bridge is green too: the machine has run MIT's boot PROM out of real DDR3L through it on this board, 256 reads and 256 writes asked and answered at the controller's own interface. The disk controller, the TV, the I/O board and the debug cable adapter are turquoise: nothing on this board has driven them yet. Six things are crossed off as not available on this board: the display output block, the fifth port that fed it, the HDMI out connector, the USB input program, the USB host controller and the port it would drive, this board having no HDMI connector and no USB host of any kind. What it does have is one micro-USB socket, the FTDI bridge, carrying a console and JTAG together, and that socket is drawn under the UART that drives it, in the row of connectors along the board's edge where every board's is. Of the five ports the processing system gave the larger board, S_AXI_HP3 is the one nothing replaces and it is crossed off with the display it fed; the other four positions carry what the soft processing system needs instead. Two of them are not ports at all here, because the memory controller is in the fabric and a plain bus reaches it: the machine's own memory bus where S_AXI_HP0 was, which is green, the machine having run MIT's boot PROM out of real DDR3L through it on this board; and the disk controller's, which would fetch the pack's blocks out of memory, where S_AXI_HP2 was, which is not started, the pack face's memory master not being joined to the controller yet. Both run on down into the controller. The other two are the machine's register faces where M_AXI_GP0 was and the debug window where M_AXI_GP1 was. The faces themselves do not change: the disk controller's, the I/O board's, the input card's and the debug cable's are the same registers at the same addresses, and what changes is who masters them. Below them, in the room the Linux programs held, is the soft processing system: a small soft processor, an Ibex, in the place muir holds on a board with Arm cores to run it on, and the firmware's own services in the places the programs held --- an RFB server for the screen, the keys and the mouse, which on this board is the only way in; Chaosnet; the CADR's serial line; the disk packs as files on a card; and the console. The console is green: it is what has halted the machine on this board, stepped it by one microcycle with SSDONE up and started it again, read at the wire. The disk packs are partly built, the firmware having read the pack face's own registers with no card behind them and no block moved. The RFB server, Chaosnet and the serial line are not started. At the foot of that room is a row of controllers, each of them over the connector it drives, standing where the other boards' drawings put the processing system's own: the memory controller, the MAC, the SD host, the UART and the USB host. Every line that leaves a service ends on one of these and never on a connector, and each controller has one line down to its own. Not one of that row is a hard block here. The Ibex is green, its firmware having run on this board, read the four register faces and worked the machine through the console's; the memory controller and the UART are green with it; the MAC, the SD host and the boot are not started, and the USB host is crossed off with the port it would drive. Beside the room, where U-Boot and its first stage sit on the other boards, is the boot: this part has no boot ROM and no card controller, so it configures itself out of its own 16 MB QSPI flash at power-on, and that flash carries the bitstream and the firmware beside it, with a first-stage loader in block RAM copying the firmware into memory and starting it. Main memory is a controller in the fabric rather than a processing system's own, because the 256 MB of DDR3L on this board is on the fabric's own pins; the machine's memory port reaches it on one side and the soft processor on the other. In the row with that controller, in the one position every board's drawing gives it, is the UART: here it is ours and it is green, the firmware's own console having been read at the wire at 115,200 baud, where on a Zynq board it is the part's own silicon and Linux's console comes out of it; and on every board it reaches the micro-USB socket drawn under it. Beside the bus interface, a debug cable adapter puts the cable's 21 wires --- 20 signals out and 19 back, the data bus going both ways --- onto one Pmod connector of 8 pins and carries the whole link in both directions. It is the same fabric the Zynq boards carry, where MIT's own debugger has halted the machine and read it back; nothing has driven it here, and the debugger at the other end of JA would be one of the other boards. Six status lights at the board's right, drawn in the colour each shows when it is lit and numbered as this board numbers them, which is the other way round from the Zynq boards: its four tricolour lamps are LD0 to LD3 and its four green ones LD4 to LD7, and the two tricolour lamps left over are dark. LD4 is MACHRUN, the machine's own run signal as a level, dim when it is waiting for memory; LD5 the fabric's clock and LD6 retiring microcycles, both blinking; LD7 the disk moving a block; LD0 dark until the machine halts itself on an error and then red; LD1 PROMENABLE, the boot PROM's own select, blue while the machine fetches its microinstructions out of the boot PROM and dark once it runs microcode it loaded from a disk. Above them, BTN0 is the machine's boot button, the light panel's own -BOOT2, and BTN1 below it in the same block resets the whole fabric, which is the same pair of buttons on every board here; above BTN0, SW0 is the no-auto-boot switch, which this board has. At the board's edge, one under each controller of the row: the 256 MB of DDR3L, the board's own Ethernet PHY on fabric pins, which is what lets a MAC in fabric reach a wire at all, a microSD card on a Pmod in JD, this board having no card slot of its own, the one micro-USB socket that carries the console and JTAG, and the USB host port this board does not have, crossed off with its controller. Under the fabric's label, two figures for the whole board, place and routed with the memory controller behind the machine and the soft processing system in front of its register faces: 6,109 of the 15,850 slices occupied, 38.5 per cent; and 218 KB of the 608 KB of block RAM, 35.9 per cent. The timing of this build is met: the fabric runs at 100 megahertz with a tick of 10 nanoseconds, worst slack plus 0.354 nanoseconds against that, and none of its 60,251 endpoints failing. There are no boot sequence drawings on this page, because nothing has yet booted this board from its own flash. ">
