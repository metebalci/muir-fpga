<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muir-fpga — the MIT CADR on an Arty Z7-20</title>
<meta name="description" content="The proposed architecture for running the MIT CADR Lisp Machine in fabric at rtl level on a Digilent Arty Z7-20: what is fabric, what is Linux on the PS, and where the two meet.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section>
  <div class="band">
    <figure class="fig dense">
      <div class="scroll">
<svg viewBox="0 0 1150 870" role="img" aria-label="The CADR mapped onto one XC7Z020. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface — the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 200 MHz, 29 ticks to the 145 ns microcycle. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller and the TV, and to the Unibus, carrying the I/O board. Four AXI ports cross into the processing system: S_AXI_HP0, which the memory bridge masters; S_AXI_HP1, which the disk controller masters to fetch a block out of DDR itself; and M_AXI_GP0, over which the PS reaches the Chaosnet buffers and the console; and M_AXI_GP1, over which muir on the PS drives the debug cable. On the Linux side: the RFB server, the pack as a file on microSD, Chaosnet routing over gigabit Ethernet, and the console. The 512 MB of DDR3 sits outside the chip, holding main memory and the display's frame buffer, which the RFB server reads directly.">
          <text class="d-t" x="10" y="18">XC7Z020-1CLG400C &mdash; the machine and its host on one chip</text>
          <rect class="d-box" x="10" y="28" width="1070" height="668.5"/>

          <text class="d-s" x="16" y="48">PL &mdash; fabric</text>
          <text class="d-s" x="156" y="50">the processor: two boards</text>

          <!-- the clock generator -->
          <rect class="d-box" x="40" y="62" width="112" height="128"/>
          <text class="d-t" x="96" y="100" text-anchor="middle">clock</text>
          <text class="d-n" x="96" y="120" text-anchor="middle">CLOCK1, CLOCK2</text>
          <text class="d-s" x="96" y="142" text-anchor="middle">200 MHz,</text>
          <text class="d-s" x="96" y="156" text-anchor="middle">5 ns a tick</text>
          <text class="d-s" x="96" y="176" text-anchor="middle">29 = 145 ns</text>

          <!-- the processor: two boards -->
          <rect class="d-box" x="152" y="62" width="224" height="56"/>
          <text class="d-t" x="264" y="84" text-anchor="middle">ICMEM board</text>
          <text class="d-s" x="264" y="104" text-anchor="middle">the control store: 16K &times; 48, 768 Kb</text>
          <rect class="d-box" x="152" y="118" width="224" height="72"/>
          <text class="d-t" x="264" y="142" text-anchor="middle">CADR board</text>
          <text class="d-s" x="264" y="162" text-anchor="middle">datapath, sequencer,</text>
          <text class="d-s" x="264" y="176" text-anchor="middle">scratchpads, maps</text>

          <!-- the five cables -->
          <line class="d-line" x1="376" y1="90" x2="596" y2="90"/>
          <text class="d-s" x="486" y="82" text-anchor="middle">1AJ1-J08 &mdash; 12 wires</text>
          <text class="d-s" x="486" y="108" text-anchor="middle">clock, SPY control, resets</text>
          <line class="d-line" x1="376" y1="154" x2="596" y2="154"/>
          <text class="d-s" x="486" y="146" text-anchor="middle">four cables &mdash; 80 wires</text>
          <text class="d-n" x="486" y="170" text-anchor="middle">MEM&lt;31:0&gt;, SPY&lt;15:0&gt;</text>
          <text class="d-s" x="486" y="184" text-anchor="middle">48 driven from both ends</text>

          <!-- the bus interface -->
          <rect class="d-box" x="596" y="62" width="254" height="128"/>
          <text class="d-t" x="723" y="92" text-anchor="middle">bus interface</text>
          <text class="d-n" x="723" y="112" text-anchor="middle">BUSINT</text>
          <text class="d-s" x="723" y="138" text-anchor="middle">arbitration, the NXM timeout,</text>
          <text class="d-s" x="723" y="152" text-anchor="middle">the address decode, -HANG,</text>
          <text class="d-s" x="723" y="166" text-anchor="middle">its own registers, the debug cable</text>

          <!-- The debug cable, DBGOUT/DBGIN. It leaves the bus interface two ways:
               up through the chip's pins to a pair of Pmods for a second board,
               and across to M_AXI_GP1 for muir running on this board's own PS.
               Neither path touches the other PS software. -->
          <path class="d-line" d="M850,160 L1115,160 L1115,712 M890,712 L1115,712 M890,712 L890,728 M1060,712 L1060,728 M990,160 L990,464 M990,508 L990,562"/>
          <text class="d-s" x="982" y="300" text-anchor="end">debug cable</text>

          <!-- the two buses -->
          <path class="d-line" d="M723,190 L723,208 M270,208 L723,208 M270,208 L270,238 M660,208 L660,238"/>
          <line class="d-bus" x1="40" y1="238" x2="570" y2="238"/>
          <text class="d-s" x="40" y="228">Xbus, 32 bits, synchronous</text>
          <line class="d-bus" x1="620" y1="238" x2="906" y2="238"/>
          <text class="d-s" x="906" y="228" text-anchor="end">Unibus, 16 bits, open collector</text>

          <path class="d-line" d="M118,238 L118,274 M310,238 L310,274 M497,238 L497,274 M725,238 L725,274"/>

          <!-- on the Xbus -->
          <rect class="d-box" x="40" y="274" width="156" height="112"/>
          <text class="d-t" x="118" y="300" text-anchor="middle">Xbus to DDR</text>
          <text class="d-s" x="118" y="320" text-anchor="middle">main memory and</text>
          <text class="d-s" x="118" y="334" text-anchor="middle">the display&rsquo;s buffer</text>
          <text class="d-s" x="118" y="360" text-anchor="middle">an AXI4 master</text>

          <rect class="d-box" x="210" y="274" width="200" height="112"/>
          <text class="d-t" x="497" y="300" text-anchor="middle">TV</text>
          <text class="d-s" x="497" y="320" text-anchor="middle">scan counters and</text>
          <text class="d-s" x="497" y="334" text-anchor="middle">the mode register</text>
          <text class="d-n" x="497" y="356" text-anchor="middle">SIMPLETV</text>
          <text class="d-s" x="497" y="376" text-anchor="middle">the buffer is in DDR</text>

          <rect class="d-box" x="424" y="274" width="146" height="112"/>
          <text class="d-t" x="310" y="300" text-anchor="middle">disk controller</text>
          <text class="d-s" x="310" y="320" text-anchor="middle">its own microcode; the Trident&rsquo;s</text>
          <text class="d-s" x="310" y="334" text-anchor="middle">bus timing, seek and rotation</text>
          <text class="d-n" x="310" y="356" text-anchor="middle">CADRDC</text>
          <text class="d-s" x="310" y="376" text-anchor="middle">an AXI4 master</text>

          <!-- on the Unibus -->
          <rect class="d-box" x="620" y="274" width="210" height="112"/>
          <text class="d-t" x="725" y="300" text-anchor="middle">I/O board</text>
          <text class="d-s" x="725" y="320" text-anchor="middle">keyboard, mouse, clocks, serial</text>
          <text class="d-s" x="725" y="334" text-anchor="middle">Chaosnet: encode, decode, collision</text>
          <text class="d-n" x="725" y="356" text-anchor="middle">CADRIO</text>
          <text class="d-s" x="725" y="376" text-anchor="middle">the cable, not the protocol</text>

          <!-- down to the AXI ports -->
          <path class="d-line" d="M118,386 L118,464"/>
          <text class="d-s" x="126" y="412">the only seam at machine speed</text>
          <!-- The disk's second leg: Linux writes the controller where the block is.
               Not one of the CADR's own disk registers, which are Xbus addresses
               the microcode writes; this one exists only because the pack is a file. -->
          <path class="d-line" d="M310,386 L310,464 M725,386 L725,464 M876,238 L876,464 M380,386 L380,432.2 L660,432.2 L660,464"/>
          <text class="d-s" x="400" y="424">the block&rsquo;s address</text>
          <text class="d-s" x="870" y="262" text-anchor="end">the console</text>
          <text class="d-s" x="302" y="452" text-anchor="end">the block, pulled</text>
          <text class="d-s" x="732" y="420.7">packets, keys, mouse</text>

          <!-- the PS-PL boundary, which the three ports cross -->
          <path class="d-dash" d="M10,486 L38,486 M198,486 L230,486 M390,486 L640,486 M890,486 L920,486 M1060,486 L1080,486"/>
          <rect class="d-fill" x="38" y="464" width="160" height="44"/>
          <text class="d-m" x="118" y="483" text-anchor="middle">S_AXI_HP0</text>
          <text class="d-s" x="118" y="499" text-anchor="middle">PL masters, 64 bits, AXI3</text>
          <rect class="d-fill" x="230" y="464" width="160" height="44"/>
          <text class="d-m" x="310" y="483" text-anchor="middle">S_AXI_HP1</text>
          <text class="d-s" x="310" y="499" text-anchor="middle">PL masters, 64 bits, AXI3</text>
          <rect class="d-fill" x="640" y="464" width="250" height="44"/>
          <text class="d-m" x="765" y="483" text-anchor="middle">M_AXI_GP0</text>
          <text class="d-s" x="765" y="499" text-anchor="middle">PS masters, 32 bits, AXI3</text>
          <rect class="d-fill" x="920" y="464" width="140" height="44"/>
          <text class="d-m" x="990" y="483" text-anchor="middle">M_AXI_GP1</text>
          <text class="d-s" x="990" y="499" text-anchor="middle">PS masters, 32 bits, AXI3</text>

          <!-- the PS -->
          <text class="d-s" x="16" y="540.4">PS &mdash; Linux</text>
          <path class="d-line" d="M765,508 L765,533.2 M360,533.2 L846,533.2 M360,533.2 L360,562 M522,533.2 L522,562 M684,533.2 L684,562 M846,533.2 L846,562"/>

          <rect class="d-dash" x="290" y="562" width="140" height="96"/>
          <text class="d-t" x="360" y="586" text-anchor="middle">RFB server</text>
          <text class="d-s" x="360" y="606" text-anchor="middle">TCP, encoding,</text>
          <text class="d-s" x="360" y="620" text-anchor="middle">keysym mapping</text>
          <text class="d-s" x="360" y="642" text-anchor="middle">the screen and the keys</text>

          <rect class="d-dash" x="614" y="562" width="140" height="96"/>
          <text class="d-t" x="684" y="586" text-anchor="middle">the pack</text>
          <text class="d-s" x="684" y="606" text-anchor="middle">the drive&rsquo;s blocks</text>
          <text class="d-s" x="684" y="620" text-anchor="middle">as a file</text>
          <text class="d-s" x="684" y="642" text-anchor="middle">staged into DDR</text>

          <rect class="d-dash" x="452" y="562" width="140" height="96"/>
          <text class="d-t" x="522" y="586" text-anchor="middle">Chaosnet</text>
          <text class="d-s" x="522" y="606" text-anchor="middle">routing and</text>
          <text class="d-s" x="522" y="620" text-anchor="middle">its services</text>
          <text class="d-s" x="522" y="642" text-anchor="middle">for the other machines</text>

          <rect class="d-dash" x="776" y="562" width="140" height="96"/>
          <text class="d-t" x="846" y="586" text-anchor="middle">the console</text>
          <text class="d-s" x="846" y="606" text-anchor="middle">halt, step and inspect</text>
          <text class="d-s" x="846" y="620" text-anchor="middle">over the SPY wires</text>
          <text class="d-s" x="846" y="642" text-anchor="middle">a Unibus master</text>

          <rect class="d-dash" x="945" y="562" width="90" height="96"/>
          <text class="d-t" x="990" y="586" text-anchor="middle">muir</text>
          <text class="d-s" x="990" y="606" text-anchor="middle">on the PS,</text>
          <text class="d-s" x="990" y="620" text-anchor="middle">running CC</text>
          <text class="d-s" x="990" y="642" text-anchor="middle">the debugger</text>

          <!-- main memory: straight past the software, out to the DRAM -->
          <path class="d-line" d="M118,508 L118,728 M240,508 L240,728"/>
          <text class="d-s" x="126" y="618">no software</text>
          <text class="d-s" x="126" y="632">in this path</text>
          <path class="d-line" d="M320,658 L320,728 M425,658 L425,728 M522,658 L522,728 M684,658 L684,728"/>
          <text class="d-s" x="36" y="836">the RFB server reads the display&rsquo;s buffer straight out of DDR</text>

          <rect class="d-dash" x="28" y="728" width="332" height="84"/>
          <text class="d-t" x="194" y="754" text-anchor="middle">512 MB DDR3</text>
          <text class="d-s" x="194" y="776" text-anchor="middle">main memory: 8 MB at 32 boards,</text>
          <text class="d-s" x="194" y="790" text-anchor="middle">15 MB at 60, the display&rsquo;s buffer,</text>
          <text class="d-s" x="194" y="804" text-anchor="middle">and the block the disk is fetching</text>
          <text class="d-s" x="700" y="716">on the board, not in the chip</text>
          <rect class="d-dash" x="820" y="728" width="140" height="84"/>
          <text class="d-t" x="890" y="754" text-anchor="middle">Pmod DBGOUT</text>
          <text class="d-s" x="890" y="776" text-anchor="middle">1 clock + 7 data,</text>
          <text class="d-s" x="890" y="790" text-anchor="middle">four beats</text>
          <rect class="d-dash" x="990" y="728" width="140" height="84"/>
          <text class="d-t" x="1060" y="754" text-anchor="middle">Pmod DBGIN</text>
          <text class="d-s" x="1060" y="776" text-anchor="middle">1 clock + 7 data,</text>
          <text class="d-s" x="1060" y="790" text-anchor="middle">three beats</text>
          <text class="d-s" x="820" y="836">21 wires: 4 out, 1 back, 16 both ways;</text>
          <text class="d-s" x="820" y="850">to another muir-fpga board</text>

          <!-- The connectors on the board itself. The pack is a file on the
               card; the terminal is a VNC client and Chaosnet's other machines
               are elsewhere on the network, so both leave by the same socket. -->
          <rect class="d-dash" x="390" y="728" width="210" height="84"/>
          <text class="d-t" x="495" y="754" text-anchor="middle">gigabit Ethernet</text>
          <text class="d-s" x="495" y="778" text-anchor="middle">the terminal is a VNC client;</text>
          <text class="d-s" x="495" y="794" text-anchor="middle">Chaosnet reaches its other machines</text>
          <rect class="d-dash" x="630" y="728" width="160" height="84"/>
          <text class="d-t" x="710" y="754" text-anchor="middle">microSD</text>
          <text class="d-s" x="710" y="778" text-anchor="middle">the pack lives here,</text>
          <text class="d-s" x="710" y="794" text-anchor="middle">as a file</text>
        </svg>
      </div>
    </figure>
  </div>
</section>
