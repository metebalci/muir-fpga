<title>muir-fpga — the MIT CADR on an Arty Z7-20</title>
<meta name="description" content="The proposed architecture for running the MIT CADR Lisp Machine in fabric at rtl level on a Digilent Arty Z7-20: what is fabric, what is Linux on the PS, and where the two meet.">

<section>
  <div class="band">
    <h2>muir-fpga on the Arty Z7-20</h2>
    <figure class="fig dense">
      <div class="scroll">
<svg viewBox="0 0 900 752" role="img" aria-label="The CADR mapped onto one XC7Z020. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface — the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 200 MHz, 29 ticks to the 145 ns microcycle. The bus interface fans out to the Xbus, carrying the DDR bridge, the TV and the disk controller, and to the Unibus, carrying the I/O board. Two AXI ports cross into the processing system: S_AXI_HP0, which the memory bridge masters, and M_AXI_GP0 with AXI4-Lite for the disk and Chaosnet buffers and the console. On the Linux side: the RFB server, the pack as a file on microSD, Chaosnet routing over gigabit Ethernet, and the console. The 512 MB of DDR3 sits outside the chip, holding main memory and the display's frame buffer, which the RFB server reads directly.">
          <text class="d-t" x="10" y="18">XC7Z020-1CLG400C &mdash; the machine and its host on one chip</text>

          <rect class="d-dash" x="574" y="514" width="140" height="96"/>
          <text class="d-t" x="644" y="538" text-anchor="middle">Chaosnet</text>
          <text class="d-s" x="644" y="558" text-anchor="middle">routing and</text>

          <text class="d-s" x="118" y="728" text-anchor="middle">and the display&rsquo;s buffer</text>
          <text class="d-s" x="216" y="716">on the board, not in the chip</text>
        </svg>
      </div>
      <figcaption><p>The proposed architecture. <strong>Solid is fabric; dashed is the PS side and the DRAM behind it.</strong> The outline says where a thing runs, not how far along it is: this is a design document and it moves.</p><p>The boxes name the boards of the real machine. What goes into fabric is <strong>rtl level</strong> &mdash; the machine&rsquo;s own two-phase clock, every datapath signal on it, and everything that is a matter of <em>when</em>. It is checked against MIT&rsquo;s netlists rather than being them; whether a gate-level implementation ever follows is an open question and not a promise this drawing makes.</p></figcaption>
    </figure>
  </div>
