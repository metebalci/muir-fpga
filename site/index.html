 which the drawing otherwise says in colour: the clock generator, the two processor boards and the Xbus-to-DDR bridge are built and checked, and the machine they compose runs on the board today from the boot PROM, with no memory behind it, and its first 1,024 microcycles have been read back over JTAG and agree with muir column by column, which is 0.17 per cent of the run and reaches no memory cycle; the bus interface is partly built, wanting only the debug cable; the disk controller is partly built, its four registers answering the boot PROM's polls and checked against muir, its channel not started; the TV and the I/O board are not started. The memory path over S_AXI_HP0, drawn from the bridge through the port to the DDR3, is verified: every piece of it has a check, and the machine has run its boot PROM out of real DDR3 on the board with a witness outside its logic counting every cycle. Below the drawing, two bars: 5.45 per cent of the LUTs, 2,897 of 53,200, and 20.00 per cent of the block RAM, 28 tiles of 140. ">
