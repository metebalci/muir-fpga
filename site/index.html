<svg viewBox="0 0 1810 865" role="img" aria-label="The CADR mapped onto one XC7Z020. In the programmable logic: the ICMEM board carrying the control store and the CADR board below it, joined by five cables to the bus interface — the ICMEM board's own cable of 12 wires carrying the clock, the SPY control and the resets, and four cables of 80 wires carrying MEM and SPY, 48 of them driven from both ends. A clock generator at the left runs at 200 MHz, 29 ticks to the 145 ns microcycle. The bus interface fans out to the Xbus, carrying the DDR bridge, the disk controller and the TV, and to the Unibus, carrying the I/O board. Five AXI ports cross into the processing system: S_AXI_HP0, which the memory bridge masters; S_AXI_HP2, which the disk controller masters to fetch a block out of DDR itself; and M_AXI_GP0, over which the PS reaches the disk controller and the Chaosnet buffers; and M_AXI_GP1, carrying the console --- the sixteen diagnostic registers, checked in simulation against muir's own spy vocabulary --- and later the debug cable. Beside the bus interface, a debug cable adapter, not started, puts the cable's 21 wires --- 20 signals out and 17 in, the data bus going both ways --- onto two Pmod connectors of 8 pins each, one clock and seven data, and presents the same registers on M_AXI_GP1; the two Pmod connectors are drawn at the board's right side. Six status lights at the board's right, drawn in the colour each shows when it is lit: LD0 the fabric's clock and LD1 retiring microcycles, both blinking; LD2 PROMDISABLED, lit once the machine has left its boot PROM and runs the microcode it loaded from the disk; LD3 the disk moving a block; LD4 dark until something goes wrong and then red, an error light; LD5 MACHRUN, the machine's own run signal as a level, dim when it is waiting for memory. The TV block's display goes to a display output block at the fabric's left, not started, which scans the display's buffer out of DDR over a fifth port, S_AXI_HP3, and drives the board's HDMI out connector; the USB input program carries a keyboard and mouse from the board's USB host connector. Neither is started. On the Linux side: the RFB server, Chaosnet routing over gigabit Ethernet, the pack as a file on the microSD card --- its feeder program serving the controller's requests on the board, verified --- the console, the serial port --- the CADR's serial line offered on a TCP socket as muir offers it --- and USB input, which carries the keyboard and mouse onto the I/O board; the rest not started. Below the ports is the processing system: an outline for Linux on the Arm cores, partly built: it boots from the card beside the running CADR with the CADR's 128 MB kept from it, and holds the programs that will run under it, none of them started; beside it the boot loader, U-Boot, verified: mainline U-Boot with its own first stage, built here, boots the board from the card and over the network, and beside it a DDR controller with four arbitrated ports, fed by the two fabric ports from above and by the Arm cores from the Linux group beside it, and one line out of the chip to the DRAM. The microSD card holds everything the board needs: U-Boot with its first stage, the CADR's bitstream, Linux with its root filesystem, and the disk pack as a file. The two sequence drawings below say how the board boots, on its own from the card and, for development, from a TFTP server. The 512 MB of DDR3 sits outside the chip, holding main memory and the display's frame buffer; the RFB server reaches it through the processor's own port on the controller, like any other software. How far along each block is, which the drawing otherwise says in colour --- green only for what the board itself has shown, turquoise for what is checked here and has not run on the board: the clock generator, the two processor boards and the Xbus-to-DDR bridge are built and checked, and the machine they compose runs on the board today from the boot PROM, with no memory behind it, and its first 1,024 microcycles have been read back over JTAG and agree with muir column by column, which is 0.17 per cent of the run and reaches no memory cycle; the bus interface is partly built, wanting only the debug cable; the disk controller is verified: its registers, its drive, its channel, Read All and Write All are checked against muir over a scripted trace, its pack side and request path against a modelled memory, and on the board the CADR reads and writes its pack through it, tens of thousands of blocks in the first minutes after a drive came present; the TV is checked in simulation and has not run on the board --- muir's simpletv tick for tick over 77 million ticks, its frame buffer a window into the display's own region of DDR; the I/O board is not started. The memory path over S_AXI_HP0, drawn from the bridge through the port to the DDR3, is verified: every piece of it has a check, and the machine has run its boot PROM out of real DDR3 on the board with a witness outside its logic counting every cycle. Under the fabric's label, two figures for the memory-on board with the disk in it: 2,555 of the 13,300 slices occupied, 19.2 per cent, which is a conservative figure since a fuller design packs tighter; 7,318 of the 53,200 lookup tables, 13.8 per cent; and 171 KB of the 630 KB of block RAM, 27.1 per cent. ">

    <figure class="fig dense">
      <div class="scroll">
        <svg viewBox="0 0 1170 520" role="img" aria-label="How the board boots on its own, as a sequence. Three lifelines: the microSD card, the processing system, and the fabric. A reset starts the boot ROM, which reads the boot-mode jumper and loads BOOT.BIN from the card: U-Boot's own first stage, which runs the start-up routine, brings up DDR3 and loads U-Boot proper, also from the card. U-Boot reads uEnv.txt if the card has one; with no server named it loads cadr.bit from the card into the fabric, from which moment the CADR runs out of DDR3, then the device tree, the kernel and the root filesystem image from the card, and boots Linux beside the CADR with the CADR's 128 MB reserved. Linux reaches a login on the serial console; a keyboard on the USB port and a display on HDMI are the machine's own. On failure the loader tries again every ten seconds.">
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
            </marker>
          </defs>
          <text class="d-t" x="10" y="18">how the board boots</text>
          <text class="d-s" x="170" y="18">from the microSD card alone; no network needed</text>
          <!-- lifelines -->
          <rect class="d-box d-ext" x="60" y="34" width="120" height="30"/>
          <text class="d-t" x="120" y="54" text-anchor="middle">microSD card</text>

          <rect class="d-fill" x="540" y="114" width="30" height="60"/>

          <text class="d-s" x="330" y="100" text-anchor="middle">BOOT.BIN &mdash; U-Boot&rsquo;s first stage</text>
          <line class="d-line" x1="120" y1="166" x2="540" y2="166" marker-end="url(#arr)"/>

          <line class="d-line" x1="120" y1="214" x2="540" y2="214" marker-end="url(#arr)"/>
          <text class="d-s" x="330" y="210" text-anchor="middle">uEnv.txt, if there is one &mdash; names no server</text>

    <figure class="fig dense">
