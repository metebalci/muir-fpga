#
# The card, as an image: what docs/boot.md's sfdisk/mkfs.vfat/cp recipe makes
# by hand, made by genimage so that the laptop can `dd` one file instead.
# MBR, two primary FAT32 partitions of type 0x0c, both aligned to a megabyte,
# written by boards/arty-z7-20/linux/mksd-buildroot.sh --- because uEnv.txt carries the TFTP
# server's address and only exists at staging time.
#
# **TWO PARTITIONS, SO THAT THE CARD IS WRITTEN ONCE AND NEVER LEAVES THE
# BOARD.**
#
#   1  BOOT   512 MiB at 1 MiB, bootable.  BOOT.BIN (U-Boot's SPL, the name
#             the boot ROM looks for), u-boot.img, uEnv.txt, and on a
#             standalone card cadr.bit, zynq-arty-z7-20.dtb, zImage and
#             rootfs.cpio.uboot.  About 12 MB of files.  Linux mounts it
#             READ-ONLY (`S80cadr-disk-pack`); a power cut while the loader
#             is writable is a board that needs a card reader again.
#   2  PACKS  the rest, ${CADR_PACKS_SIZE}.  Nothing but disk packs:
#             disk-pack-0.img to disk-pack-7.img, one a unit, whichever
#             exist.  Mounted read-write, and the three gestures --- copy a
#             pack in, rename one out, `chmod -w` one --- are the whole of
#             disk administration from then on.  **Neither the boot ROM nor
#             U-Boot ever looks at this partition.**
#
# **FAT AND NOT ext4, DELIBERATELY**: the card must be readable and writable
# from Windows, which cannot write ext4.  What that costs is the journal, and
# what makes the cost bearable is that a pack is a working copy whose master
# is in the archive, and that the partition it would hurt to lose --- the
# loader's --- is out of the way behind a read-only mount.  `-F 32` is
# passed rather than left to mkfs.vfat's own size heuristic, so that "FAT32"
# is a claim this file makes and not one it hopes for.
#
# THE SIZE OF THE SECOND PARTITION comes from the environment, because a card
# is whatever card somebody has: boards/arty-z7-20/linux/mksd-buildroot.sh sets
# CADR_PACKS_SIZE from its PACKS_MB (3,584 MiB by default, which is thirteen
# T-300 packs and fits any 4 GB card and up).  genimage expands ${...} in a
# value through libconfuse, so this file stays a genimage config and not a
# template --- and a config nothing can run is a claim nothing exercises.
#
# No file list in either image: genimage copies a staged directory in whole
# (its rootpath plus the mountpoint), so which packs are on the card is
# decided by what the script staged and this file does not have to know.
image boot.vfat {
	vfat {
		label = "BOOT"
		extraargs = "-F 32"
	}
	size = 512M
	mountpoint = "/card"
}

image packs.vfat {
	vfat {
		label = "PACKS"
		extraargs = "-F 32"
	}
	size = "${CADR_PACKS_SIZE}"
	mountpoint = "/packs"
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition packs {
		partition-type = 0xC
		image = "packs.vfat"
	}
}
