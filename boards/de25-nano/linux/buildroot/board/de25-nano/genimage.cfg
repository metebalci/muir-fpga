#
# The card, as an image: the Zynq boards' two partitions and their sizes, made
# by genimage so that the laptop can `dd` one file.  MBR, two primary FAT32
# partitions of type 0x0c, both aligned to a megabyte, written by
# boards/arty-z7-20/linux/mksd-buildroot.sh with BOARD_DIR=boards/de25-nano.
# The Cora Z7-07S's file says at length why each choice is as it is, and every
# reason there holds here.
#
#   1  BOOT   at 1 MiB.  Two files at the root, whose names are not ours to
#             move: u-boot.itb, which the first-stage loader in the QSPI flash
#             asks for by that name (CONFIG_SPL_FS_LOAD_PAYLOAD_NAME), and
#             uEnv.txt.  There is no BOOT.BIN: the first-stage loader is in
#             the flash.  The board's own four --- cadr.core.rbf,
#             socfpga_agilex5_de25_nano_cadr.dtb, Image and rootfs.cpio.uboot
#             --- in a folder named `de25-nano`, which is what the TFTP
#             server's directory for this board is called.  Linux mounts it
#             read-only.  Marked bootable like the Zynq boards' though nothing
#             here reads the mark: the loader asks for partition 1
#             (CONFIG_SYS_MMCSD_FS_BOOT_PARTITION), and one card layout is one
#             thing to check.
#   2  PACKS  the rest.  Nothing but disk packs and the two files of flags,
#             exactly as on the Zynq boards; neither the loader nor U-Boot
#             ever looks at it.
#
# THE SIZES COME FROM THE ENVIRONMENT, which the staging script sets from its
# BOOT_MB and PACKS_MB.

image boot.vfat {
	vfat {
		label = "BOOT"
		extraargs = "-F 32"
	}
	size = "${CADR_BOOT_SIZE}"
	mountpoint = "/card"
}

image packs.vfat {
	vfat {
		label = "PACKS"
		extraargs = "-F 32"
	}
	size = "${CADR_PACKS_SIZE}"
	mountpoint = "/packs"
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition packs {
		partition-type = 0xC
		image = "packs.vfat"
	}
}
