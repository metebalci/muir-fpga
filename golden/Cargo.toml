[package]
name = "golden"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Mete Balci"]
description = "Reference traces for muir-fpga, taken from muir itself."
repository = "https://github.com/metebalci/muir-fpga"
readme = "../README.md"
publish = false

[[bin]]
name = "phase_gen"
path = "src/phase_gen.rs"

[[bin]]
name = "cables"
path = "src/cables.rs"

[[bin]]
name = "busint_xbus"
path = "src/busint_xbus.rs"

[[bin]]
name = "xbus_decode"
path = "src/xbus_decode.rs"

[[bin]]
name = "rtl"
path = "src/rtl.rs"

[[bin]]
name = "power_on"
path = "src/power_on.rs"

[[bin]]
name = "prom"
path = "src/prom.rs"

[[bin]]
name = "sync_prom"
path = "src/sync_prom.rs"

[[bin]]
name = "rtl_sys"
path = "src/rtl_sys.rs"

[[bin]]
name = "disk"
path = "src/disk.rs"

[[bin]]
name = "disk_boot"
path = "src/disk_boot.rs"

[dependencies]
muir = { path = "../../muir" }

[[bin]]
name = "tv"
path = "src/tv.rs"

[[bin]]
name = "color_tv"
path = "src/color_tv.rs"

[[bin]]
name = "iob"
path = "src/iob.rs"

[[bin]]
name = "busint_regs"
path = "src/busint_regs.rs"

[[bin]]
name = "sstep"
path = "src/sstep.rs"

[[bin]]
name = "dispatch_write_order"
path = "src/dispatch_write_order.rs"

[[bin]]
name = "quux"
path = "src/quux.rs"

[[bin]]
name = "muldiv"
path = "src/muldiv.rs"
