#
# The card, as an image: what docs/boot.md's sfdisk/mkfs.vfat/cp recipe makes
# by hand, made by genimage so that the laptop can `dd` one file instead.
# One FAT32 primary partition, MBR, type 0x0c, bootable, starting at sector
# 2048 --- the layout linux/mksd.sh documents and the boot ROM and U-Boot's
# `mmc 0:1` both resolve to.  Written by linux/mksd-buildroot.sh, because
# uEnv.txt carries the TFTP server's address and only exists at staging
# time; genimage's input path is the staged card directory.
#
# BOOT.BIN is the name the boot ROM looks for (Buildroot writes it as
# boot.bin; the staging script renames it).  64 MB is far more than the three
# files need (BOOT.BIN and u-boot.img are
# under a megabyte together); it is the smallest size at which FAT32 is
# unremarkable to every tool that will see the card.

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"BOOT.BIN",
			"u-boot.img",
			"uEnv.txt"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
}
