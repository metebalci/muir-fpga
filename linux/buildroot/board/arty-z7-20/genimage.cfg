#
# The card, as an image: what docs/boot.md's sfdisk/mkfs.vfat/cp recipe makes
# by hand, made by genimage so that the laptop can `dd` one file instead.
# One FAT32 primary partition, MBR, type 0x0c, bootable, starting at sector
# 2048 --- the layout linux/mksd.sh documents and the boot ROM and U-Boot's
# `mmc 0:1` both resolve to.  Written by linux/mksd-buildroot.sh, because
# uEnv.txt carries the TFTP server's address and only exists at staging
# time.
#
# THE CARD CARRIES EVERYTHING: BOOT.BIN (U-Boot's SPL, the name the boot ROM
# looks for), u-boot.img, uEnv.txt, cadr.bit, zynq-arty-z7-20.dtb, zImage,
# rootfs.cpio.uboot, and pack.img --- the disk pack as a file, 269,562,880
# bytes for a System 100 pack, which nothing writes yet.  No file list here:
# genimage copies the staged card directory in whole (its rootpath), so a
# pack is on the card when the script was given one and absent otherwise,
# and the config does not have to know which.
#
# 512 MiB: the eight files are under 12 MB without the pack and about 270 MB
# with it, and a 257 MiB file is well inside FAT32's 4 GiB limit, so the pack
# does not force a second partition.  The rest is room for the pack to be
# joined by another, or for the small persistent state docs/boot.md talks
# about.
image boot.vfat {
	vfat {
		label = "BOOT"
	}
	size = 512M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}
}
